# ==============================================================
#  ODOR LATERALIZATION PROTOCOL
#  Tests 5 conditions: bilateral, left-only, right-only,
#  left->right (20 s overlap), right->left (20 s overlap).
#
#  ┌─────────────────────────────────────────────────────┐
#  │  CHANGE THE ODOR HERE (one place, applies to all)   │
#  │  Options: ODOR1  ODOR2  ODOR3  ODOR4  ODOR5  FLUSH  │
#  └─────────────────────────────────────────────────────┘
_active_odor: &odor "ODOR1"
_mfc_odor_flow_slpm: &mfc_flow 0.3
# Trial timing knobs. Change these to retime all five trials consistently.
_trial_baseline_ms: &trial_baseline 5000
_odor_duration_ms: &odor_duration 10000
_trial_recovery_ms: &trial_recovery 10000
_trial_isi_ms: &trial_isi 50000
_lag_overlap_ms: &lag 1000
_odor_off_ms: &odor_off "_trial_baseline_ms + _odor_duration_ms"
_trial_end_trigger_ms: &trial_end_trigger "_odor_off_ms + _trial_recovery_ms"
_trial_duration_ms: &trial_duration "_trial_end_trigger_ms + _trial_isi_ms"
_overlap_second_on_ms: &overlap_second_on "_trial_baseline_ms + _lag_overlap_ms"
_overlap_second_off_ms: &overlap_second_off "_odor_off_ms + _lag_overlap_ms"
# ==============================================================

protocol:
  name: "Odor Lateralization"
  version: "1.0"
  description: >
    Olfactometer switches to odor and saturates for 60 s.
    Each trial delivers a configurable odor pulse via switch valves;
    overlap trials delay the second side by a configurable lag.
    Total ~7 min including boot and shutdown.

  timing:
    base_unit: "ms"
    sample_rate: 1000            # Hz  (1 ms precision)
    preload_lead_ms: 2
    load_req_ms: 1
    rck_pulse_ms: 1
    trig_pulse_ms: 5
    setup_hold_samples: 100
    load_mode: "global"

sequence:

  # ────────────────────────────────────────────────────────────
  #  BOOT  —  start flows, camera, olfactometers to AIR
  # ────────────────────────────────────────────────────────────
  - phase: "BOOT SEQUENCE"
    duration: 11000              # 1 s warmup + 10 s stabilization
    repeat: 0
    actions:
      - device: "mfc.air_left_setpoint"
        value: *mfc_flow
        timing: 1000
      - device: "mfc.air_right_setpoint"
        value: *mfc_flow
        timing: 1000
      - device: "mfc.odor_left_setpoint"
        value: *mfc_flow
        timing: 1000
      - device: "mfc.odor_right_setpoint"
        value: *mfc_flow
        timing: 1000
      - device: "triggers.camera_continuous"
        state: true
        timing: 1000
      - device: "olfactometer.left"
        state: "AIR"
        timing: 1000
      - device: "olfactometer.right"
        state: "AIR"
        timing: 1000
      - device: "switch_valve.left"
        state: "CLEAN"
        timing: 1000
      - device: "switch_valve.right"
        state: "CLEAN"
        timing: 1000

  # ────────────────────────────────────────────────────────────
  #  OLFACTOMETER SATURATION  —  60 s to fill odor tube
  #  Switch valves stay CLEAN; odor never reaches animal yet.
  #  Microscope pulse at 60 s marks "ready to start trials".
  # ────────────────────────────────────────────────────────────
  - phase: "OLFACTOMETER SATURATION"
    duration: 65000              # 60 s saturation + 5 s buffer
    repeat: 0
    actions:
      - device: "olfactometer.left"
        state: *odor             # <-- resolves to _active_odor above
        timing: 0
      - device: "olfactometer.right"
        state: *odor
        timing: 0
      - device: "switch_valve.left"
        state: "CLEAN"
        timing: 0
      - device: "switch_valve.right"
        state: "CLEAN"
        timing: 0
  

  # ────────────────────────────────────────────────────────────
  #  TRIAL 1 — BILATERAL
  #  Both switch valves: CLEAN -> ODOR -> CLEAN (30 s pulse)
  #
  #  Timeline:
  #    t=0 s    microscope trigger (trial start)
  #    t=10 s    SV left + right -> ODOR
  #    t=40 s    SV left + right -> CLEAN   
  #    t=40-70 s return to baseline (no odor, valves on CLEAN)
  #    t=70 s    microscope trigger (trial end) 
  #    t=70-120 s ISI (50 s)
  # ────────────────────────────────────────────────────────────
  - phase: "TRIAL 1 - BILATERAL"
    duration: *trial_duration
    repeat: 0
    actions:
      - device: "triggers.microscope"
        state: true
        timing: 0                # trial start
      - device: "switch_valve.left"
        state: "ODOR"
        timing: *trial_baseline
      - device: "switch_valve.right"
        state: "ODOR"
        timing: *trial_baseline
      - device: "switch_valve.left"
        state: "CLEAN"
        timing: *odor_off
      - device: "switch_valve.right"
        state: "CLEAN"
        timing: *odor_off
      - device: "triggers.microscope"
        state: true
        timing: *trial_end_trigger

  # ────────────────────────────────────────────────────────────
  #  TRIAL 2 — LEFT ONLY
  #  Only left switch valve opens. Right stays CLEAN.
  #
  #  Timeline:
  #    t=0 s    microscope trigger (trial start)
  #    t=10 s    SV left -> ODOR; SV right -> CLEAN 
  #    t=40 s    SV left -> CLEAN; SV right -> CLEAN
  #    t=40-70 s return to baseline (no odor, valves on CLEAN)
  #    t=70 s    microscope trigger (trial end)
  #    t=70-120 s ISI (50 s)
  # ────────────────────────────────────────────────────────────
  - phase: "TRIAL 2 - LEFT ONLY"
    duration: *trial_duration
    repeat: 0
    actions:
      - device: "triggers.microscope"
        state: true
        timing: 0                # trial start
      - device: "switch_valve.left"
        state: "ODOR"
        timing: *trial_baseline
      - device: "switch_valve.right"
        state: "CLEAN"
        timing: *trial_baseline
      - device: "switch_valve.left"
        state: "CLEAN"
        timing: *odor_off
      - device: "switch_valve.right"
        state: "CLEAN"
        timing: *odor_off
      - device: "triggers.microscope"
        state: true
        timing: *trial_end_trigger

  # ────────────────────────────────────────────────────────────
  #  TRIAL 3 — RIGHT ONLY
  #  Only right switch valve opens. Left stays CLEAN.
  #  Timeline:
  #    t=0 s    microscope trigger (trial start)  
  #    t=10 s    SV left -> CLEAN; SV right -> ODOR
  #    t=40 s    SV left -> CLEAN; SV right -> CLEAN
  #    t=40-70 s return to baseline (no odor, valves on CLEAN
  #    t=70 s    microscope trigger (trial end)
  #    t=70-120 s ISI (50 s)
  # ────────────────────────────────────────────────────────────
  - phase: "TRIAL 3 - RIGHT ONLY"
    duration: *trial_duration
    repeat: 0
    actions:
      - device: "triggers.microscope"
        state: true
        timing: 0                # trial start
      - device: "switch_valve.left"
        state: "CLEAN"
        timing: *trial_baseline
      - device: "switch_valve.right"
        state: "ODOR"
        timing: *trial_baseline
      - device: "switch_valve.left"
        state: "CLEAN"
        timing: *odor_off
      - device: "switch_valve.right"
        state: "CLEAN"
        timing: *odor_off
      - device: "triggers.microscope"
        state: true
        timing: *trial_end_trigger

  # ────────────────────────────────────────────────────────────
  #  TRIAL 4 — LEFT -> RIGHT
  #  Left switch valve opens first, then right opens while left is still ODOR.
  #  Timeline:
  #    t=0 s    microscope trigger (trial start)
  #    t=10 s    SV left -> ODOR; SV right -> CLEAN
  #    t=10+lag  SV left -> ODOR; SV right -> ODOR (overlap window)
  #    t=40 s    SV left -> CLEAN; SV right -> ODOR
  #    t=40+lag  SV left -> CLEAN; SV right -> CLEAN
  #    t=40-70 s return to baseline (no odor, valves on CLEAN)
  #    t=70 s    microscope trigger (trial end)
  #    t=70-120 s ISI (50 s)
  # ────────────────────────────────────────────────────────────
  - phase: "TRIAL 4 - LEFT -> RIGHT"
    duration: *trial_duration
    repeat: 0
    actions:
      - device: "triggers.microscope"
        state: true
        timing: 0                # trial start
      - device: "switch_valve.left"
        state: "ODOR"
        timing: *trial_baseline
      - device: "switch_valve.right"
        state: "CLEAN"
        timing: *trial_baseline
      - device: "switch_valve.left"
        state: "ODOR"
        timing: *overlap_second_on
      - device: "switch_valve.right"
        state: "ODOR"
        timing: *overlap_second_on
      - device: "switch_valve.left"
        state: "CLEAN"
        timing: *odor_off
      - device: "switch_valve.right"
        state: "ODOR"
        timing: *odor_off
      - device: "switch_valve.left"
        state: "CLEAN"
        timing: *overlap_second_off
      - device: "switch_valve.right"
        state: "CLEAN"
        timing: *overlap_second_off
      - device: "triggers.microscope"
        state: true
        timing: *trial_end_trigger

  # ────────────────────────────────────────────────────────────
  #  TRIAL 5 — RIGHT -> LEFT
  #  Right switch valve opens first, then left opens while right is still ODOR.
  #  Timeline:
  #    t=0 s    microscope trigger (trial start)
  #    t=10 s    SV left -> CLEAN; SV right -> ODOR
  #    t=10+lag  SV left -> ODOR; SV right -> ODOR (overlap window)
  #    t=40 s    SV left -> ODOR; SV right -> CLEAN
  #    t=40+lag  SV left -> CLEAN; SV right -> CLEAN
  #    t=40-70 s return to baseline (no odor, valves on CLEAN)
  #    t=70 s    microscope trigger (trial end)
  #    t=70-120 s ISI (50 s)
  # ────────────────────────────────────────────────────────────
  - phase: "TRIAL 5 - RIGHT -> LEFT"
    duration: *trial_duration
    repeat: 0
    actions:
      - device: "triggers.microscope"
        state: true
        timing: 0                # trial start
      - device: "switch_valve.left"
        state: "CLEAN"
        timing: *trial_baseline
      - device: "switch_valve.right"
        state: "ODOR"
        timing: *trial_baseline
      - device: "switch_valve.left"
        state: "ODOR"
        timing: *overlap_second_on
      - device: "switch_valve.right"
        state: "ODOR"
        timing: *overlap_second_on
      - device: "switch_valve.left"
        state: "ODOR"
        timing: *odor_off
      - device: "switch_valve.right"
        state: "CLEAN"
        timing: *odor_off
      - device: "switch_valve.left"
        state: "CLEAN"
        timing: *overlap_second_off
      - device: "switch_valve.right"
        state: "CLEAN"
        timing: *overlap_second_off
      - device: "triggers.microscope"
        state: true
        timing: *trial_end_trigger
    
  
  # ────────────────────────────────────────────────────────────
  #  OLFACTOMETER DESATURATION  —  60 s to clear odor tube
  #  Switch valves stay CLEAN; olfactometers return to AIR.
  # ────────────────────────────────────────────────────────────
  - phase: "OLFACTOMETER DESATURATION"
    duration: 65000              # 60 s desaturation + 5 s buffer
    repeat: 0
    actions:
      - device: "olfactometer.left"
        state: "AIR"
        timing: 0
      - device: "olfactometer.right"
        state: "AIR"
        timing: 5
      - device: "switch_valve.left"
        state: "CLEAN"
        timing: 0
      - device: "switch_valve.right"
        state: "CLEAN"
        timing: 0

  # ────────────────────────────────────────────────────────────
  #  SHUTDOWN  —  zero flows, stop camera, olfactometers OFF
  # ────────────────────────────────────────────────────────────
  - phase: "SHUTDOWN SEQUENCE"
    duration: 2000
    repeat: 0
    actions:
      - device: "triggers.camera_continuous"
        state: false
        timing: 0
      - device: "olfactometer.left"
        state: "OFF"
        timing: 0
      - device: "olfactometer.right"
        state: "OFF"
        timing: 5
      - device: "switch_valve.left"
        state: "CLEAN"
        timing: 10
      - device: "switch_valve.right"
        state: "CLEAN"
        timing: 15
      - device: "mfc.air_left_setpoint"
        value: 0.0
        timing: 0
      - device: "mfc.air_right_setpoint"
        value: 0.0
        timing: 0
      - device: "mfc.odor_left_setpoint"
        value: 0.0
        timing: 0
      - device: "mfc.odor_right_setpoint"
        value: 0.0
        timing: 0
