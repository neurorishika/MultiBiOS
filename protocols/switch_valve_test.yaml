# Odor Presentation Protocol Configuration
# Supports up to 1ms precision timing for NIDAQ generation

protocol:
  name: "Example Odor Protocol"
  version: "1.0"
  description: "Example Description"
  
  # Global timing settings
  timing:
    base_unit: "ms"              # Base time unit (ms for 1ms precision)
    sample_rate: 2000            # Hz - determines actual precision (10000Hz = 0.1ms)
    preload_lead_ms: 5           # lead between LOAD_REQ and RCK
    load_req_ms: 1               # width of LOAD_REQ pulse
    rck_pulse_ms: 1              # width of RCK pulse
    trig_pulse_ms: 5             # width of microscope pulses
    setup_hold_samples: 1000      # samples to hold S-bits before/after LOAD_REQ
    load_mode: "global"

# Protocol sequence definition
sequence:
  # Pre-protocol setup phase
  - phase: "BOOT SEQUENCE"
    duration: 1100 # 1 s for warmup and 5 s for stabilization
    repeat: 0
    actions:
      - device: "mfc.air_left_setpoint"
        value: 5.0 # 0-5V <,0-5sccm
        timing: 100
      - device: "mfc.air_right_setpoint"
        value: 5.0
        timing: 100
      - device: "mfc.odor_left_setpoint"
        value: 0.0
        timing: 100
      - device: "mfc.odor_right_setpoint"
        value: 0.0
        timing: 100
      - device: "olfactometer.left"
        state: "AIR" # [OFF,AIR,ODOR1,ODOR2,ODOR3,ODOR4,ODOR5,FLUSH]
        timing: 100
      - device: "olfactometer.right"
        state: "AIR"
        timing: 100
      - device: "switch_valve.left"
        state: "CLEAN" # [“CLEAN","ODOR"]
        timing: 100
      - device: "switch_valve.right"
        state: "CLEAN"
        timing: 100

  # Odor presentation trials
  - phase: "SWITCHER"
    duration: 6000            # 5 s
    times: 10                   # repeat total of 5 times
    randomize: false            # randomizes the index of the repeat
    actions:
      - device: "switch_valve.left"
        state: "ODOR"
        timing: 1000          
      - device: "switch_valve.left"
        state: "CLEAN"
        timing: 2000
      - device: "switch_valve.right"
        state: "ODOR"
        timing: 4000 
      - device: "switch_valve.right"
        value: "CLEAN"
        timing: 5000 

  # Post-protocol phase
  - phase: "SHUTDOWN SEQUENCE"
    duration: 100              # enough time for all devices to shut down
    repeat: 0
    actions:
      - device: "mfc.air_left_setpoint"
        value: 0.0
        timing: 0
      - device: "mfc.air_right_setpoint"
        value: 0.0
        timing: 0
      - device: "mfc.odor_left_setpoint"
        value: 0.0
        timing: 0
      - device: "mfc.odor_right_setpoint"
        timing: 0
        value: 0.0
      - device: "olfactometer.left"
        state: "OFF"
        timing: 0
      - device: "olfactometer.right"
        state: "OFF"
        timing: 0
      - device: "switch_valve.left"
        state: "CLEAN"
        timing: 0
      - device: "switch_valve.right"
        state: "CLEAN"
        timing: 0

